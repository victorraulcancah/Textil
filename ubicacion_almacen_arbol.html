<div style="background: var(--surface-2); border-radius: 12px; border: 0.5px solid var(--border); padding: 1.25rem;">
  <h2 class="sr-only">Mockup de árbol jerárquico para organizar ubicaciones de almacén con arrastre para reordenar</h2>

  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
    <p style="font-size:12px; color:var(--text-muted); margin:0;">Estructura de almacén</p>
    <button style="font-size:12px; padding:5px 10px; display:flex; align-items:center; gap:4px;">
      <i class="ti ti-plus" style="font-size:13px;" aria-hidden="true"></i>Agregar piso
    </button>
  </div>

  <div style="display:flex; flex-direction:column;">

    <div style="display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:var(--radius);">
      <i class="ti ti-grip-vertical" style="font-size:14px; color:var(--text-muted); cursor:grab;" aria-hidden="true"></i>
      <i class="ti ti-chevron-down" style="font-size:13px; color:var(--text-muted);" aria-hidden="true"></i>
      <i class="ti ti-building-warehouse" style="font-size:14px; color:var(--text-secondary);" aria-hidden="true"></i>
      <span style="font-size:13px; font-weight:500; flex:1;">Piso 1</span>
      <span style="font-size:11px; color:var(--text-muted);">2 pasillos</span>
      <i class="ti ti-dots" style="font-size:14px; color:var(--text-muted);" aria-hidden="true"></i>
    </div>

    <div style="display:flex; align-items:center; gap:6px; padding:7px 8px 7px 26px; border-radius:var(--radius);">
      <i class="ti ti-grip-vertical" style="font-size:14px; color:var(--text-muted); cursor:grab;" aria-hidden="true"></i>
      <i class="ti ti-chevron-down" style="font-size:13px; color:var(--text-muted);" aria-hidden="true"></i>
      <i class="ti ti-route" style="font-size:14px; color:var(--text-secondary);" aria-hidden="true"></i>
      <span style="font-size:13px; flex:1;">Pasillo A</span>
      <span style="font-size:11px; color:var(--text-muted);">2 racks</span>
      <i class="ti ti-dots" style="font-size:14px; color:var(--text-muted);" aria-hidden="true"></i>
    </div>

    <div style="display:flex; align-items:center; gap:6px; padding:7px 8px 7px 44px; border-radius:var(--radius); background:var(--bg-accent);">
      <i class="ti ti-grip-vertical" style="font-size:14px; color:var(--text-accent); cursor:grab;" aria-hidden="true"></i>
      <i class="ti ti-chevron-down" style="font-size:13px; color:var(--text-accent);" aria-hidden="true"></i>
      <i class="ti ti-stack-2" style="font-size:14px; color:var(--text-accent);" aria-hidden="true"></i>
      <span style="font-size:13px; font-weight:500; flex:1; color:var(--text-accent);">Rack 1</span>
      <span style="font-size:11px; color:var(--text-accent);">3 niveles</span>
      <i class="ti ti-dots" style="font-size:14px; color:var(--text-accent);" aria-hidden="true"></i>
    </div>

    <div style="display:flex; align-items:center; gap:6px; padding:6px 8px 6px 62px;">
      <i class="ti ti-grip-vertical" style="font-size:13px; color:var(--text-muted); cursor:grab;" aria-hidden="true"></i>
      <i class="ti ti-layout-grid" style="font-size:13px; color:var(--text-muted);" aria-hidden="true"></i>
      <span style="font-size:13px; flex:1;">Nivel 1</span>
      <span style="font-size:11px; color:var(--text-muted);">4 productos</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px; padding:6px 8px 6px 62px;">
      <i class="ti ti-grip-vertical" style="font-size:13px; color:var(--text-muted); cursor:grab;" aria-hidden="true"></i>
      <i class="ti ti-layout-grid" style="font-size:13px; color:var(--text-muted);" aria-hidden="true"></i>
      <span style="font-size:13px; flex:1;">Nivel 2</span>
      <span style="font-size:11px; color:var(--text-muted);">2 productos</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px; padding:6px 8px 6px 62px; margin-bottom:2px;">
      <i class="ti ti-grip-vertical" style="font-size:13px; color:var(--text-muted); cursor:grab;" aria-hidden="true"></i>
      <i class="ti ti-layout-grid" style="font-size:13px; color:var(--text-muted);" aria-hidden="true"></i>
      <span style="font-size:13px; flex:1;">Nivel 3</span>
      <span style="font-size:11px; color:var(--text-muted);">vacío</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px; padding:6px 8px 6px 62px; color:var(--text-secondary);">
      <i class="ti ti-plus" style="font-size:13px;" aria-hidden="true"></i>
      <span style="font-size:13px;">Agregar nivel</span>
    </div>

    <div style="display:flex; align-items:center; gap:6px; padding:7px 8px 7px 44px; border-radius:var(--radius);">
      <i class="ti ti-grip-vertical" style="font-size:14px; color:var(--text-muted); cursor:grab;" aria-hidden="true"></i>
      <i class="ti ti-chevron-right" style="font-size:13px; color:var(--text-muted);" aria-hidden="true"></i>
      <i class="ti ti-stack-2" style="font-size:14px; color:var(--text-secondary);" aria-hidden="true"></i>
      <span style="font-size:13px; flex:1;">Rack 2</span>
      <span style="font-size:11px; color:var(--text-muted);">1 nivel</span>
      <i class="ti ti-dots" style="font-size:14px; color:var(--text-muted);" aria-hidden="true"></i>
    </div>

    <div style="display:flex; align-items:center; gap:6px; padding:7px 8px 7px 26px; border-radius:var(--radius); margin-bottom:2px;">
      <i class="ti ti-grip-vertical" style="font-size:14px; color:var(--text-muted); cursor:grab;" aria-hidden="true"></i>
      <i class="ti ti-chevron-right" style="font-size:13px; color:var(--text-muted);" aria-hidden="true"></i>
      <i class="ti ti-route" style="font-size:14px; color:var(--text-secondary);" aria-hidden="true"></i>
      <span style="font-size:13px; flex:1;">Pasillo B</span>
      <span style="font-size:11px; color:var(--text-muted);">1 rack</span>
      <i class="ti ti-dots" style="font-size:14px; color:var(--text-muted);" aria-hidden="true"></i>
    </div>

    <div style="display:flex; align-items:center; gap:6px; padding:7px 8px;">
      <i class="ti ti-grip-vertical" style="font-size:14px; color:var(--text-muted); cursor:grab;" aria-hidden="true"></i>
      <i class="ti ti-chevron-right" style="font-size:13px; color:var(--text-muted);" aria-hidden="true"></i>
      <i class="ti ti-building-warehouse" style="font-size:14px; color:var(--text-secondary);" aria-hidden="true"></i>
      <span style="font-size:13px; flex:1;">Piso 2</span>
      <span style="font-size:11px; color:var(--text-muted);">0 pasillos</span>
      <i class="ti ti-dots" style="font-size:14px; color:var(--text-muted);" aria-hidden="true"></i>
    </div>

  </div>
</div>
